<meta charset="utf-8">
<title>CitrateScan Evolved</title>
<meta name="description" content="Direction A for the r1007 CitrateScan redesign: the current warm-paper and evergreen tokens, made AA-safe, with a live GhostDAG lane.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Cormorant:ital,wght@1,500&display=swap">
<style>
/* Direction A: CitrateScan, evolved. Warm paper and deep evergreen, citrate green kept for proof.
   Changes from src/scan/scan.css: AA-safe tertiary text, accent text darkened, tokens on :root with
   prefers-color-scheme + data-theme, a DAG palette, and a status palette for blue/red/chain/pending. */
:root {
  color-scheme: light;
  --font-display: "Space Grotesk", "Geist", system-ui, sans-serif;
  --font-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-serif: "Cormorant", "Cormorant Garamond", Georgia, serif;
  --r-1: 6px; --r-2: 9px; --r-3: 14px; --r-pill: 999px;
  --maxw: 1240px;
  --ease: cubic-bezier(.2,0,0,1);

  --canvas: #f1eee6;
  --surface: #faf8f3;
  --surface-2: #ffffff;
  --surface-sunk: #e9e7df;
  --border: #d6d7d0;
  --border-2: #e4e3dc;
  --border-strong: #b9bab3;
  --text-1: #0e0f0c;
  --text-2: #4b4e47;
  --text-3: #60635b;
  --accent: #8ecc09;
  --accent-ink: #0e0f0c;
  --accent-text: #446304;
  --accent-tint: #e8f3c6;
  --danger: #a72414;
  --danger-text: #9a2112;
  --danger-bg: #f6e1de;
  --warning: #b07b00;
  --warning-text: #6e5100;
  --warning-bg: #fff1c4;
  --info: #1b4965;
  --info-bg: #dbe7ef;
  --header-bg: #0f2a1a;
  --header-fg: #f1eee6;
  --header-fg-2: #a9c2b1;
  --header-border: rgba(205,231,214,.14);
  --header-field: rgba(255,255,255,.07);
  --shadow-pop: 0 10px 30px -12px rgba(14,15,12,.22), 0 0 0 1px var(--border);

  /* DAG palette */
  --dag-chain: #8ecc09;
  --dag-chain-stroke: #3a5503;
  --dag-blue: #c6e47a;
  --dag-blue-stroke: #4a6b04;
  --dag-red: #a72414;
  --dag-red-fill: #f6e1de;
  --dag-pending: #60635b;
  --dag-edge: #9a9c94;
  --dag-spine: #5a8205;
  --dag-final: rgba(142,204,9,.12);
  --dag-vote: rgba(255,189,16,.16);
  --dag-change: #b07b00;
  --dag-grid: #e2e1da;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --canvas: #0c2216; --surface: #11301f; --surface-2: #163a26; --surface-sunk: #0a1c12;
    --border: rgba(205,231,214,.16); --border-2: rgba(205,231,214,.09); --border-strong: rgba(205,231,214,.30);
    --text-1: #edf3ea; --text-2: #b8c9ba; --text-3: #94ae9b;
    --accent: #9ad60c; --accent-ink: #0c2216; --accent-text: #b2e43a; --accent-tint: rgba(142,204,9,.16);
    --danger: #ef8273; --danger-text: #f39a8d; --danger-bg: rgba(167,36,20,.26);
    --warning: #ffbd10; --warning-text: #ffcf52; --warning-bg: rgba(255,189,16,.14);
    --info: #9cc6e0; --info-bg: rgba(27,73,101,.34);
    --header-bg: #081a10; --header-fg: #edf3ea; --header-fg-2: #94ae9b; --header-border: rgba(205,231,214,.10); --header-field: rgba(255,255,255,.05);
    --shadow-pop: 0 12px 32px -12px rgba(0,0,0,.5), 0 0 0 1px var(--border);
    --dag-chain: #9ad60c; --dag-chain-stroke: #d6f28a; --dag-blue: #4f7a17; --dag-blue-stroke: #b2e43a;
    --dag-red: #ef8273; --dag-red-fill: rgba(167,36,20,.30); --dag-pending: #94ae9b; --dag-edge: #5f7f69; --dag-spine: #b2e43a;
    --dag-final: rgba(154,214,12,.10); --dag-vote: rgba(255,189,16,.12); --dag-change: #ffcf52; --dag-grid: rgba(205,231,214,.08);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #0c2216; --surface: #11301f; --surface-2: #163a26; --surface-sunk: #0a1c12;
  --border: rgba(205,231,214,.16); --border-2: rgba(205,231,214,.09); --border-strong: rgba(205,231,214,.30);
  --text-1: #edf3ea; --text-2: #b8c9ba; --text-3: #94ae9b;
  --accent: #9ad60c; --accent-ink: #0c2216; --accent-text: #b2e43a; --accent-tint: rgba(142,204,9,.16);
  --danger: #ef8273; --danger-text: #f39a8d; --danger-bg: rgba(167,36,20,.26);
  --warning: #ffbd10; --warning-text: #ffcf52; --warning-bg: rgba(255,189,16,.14);
  --info: #9cc6e0; --info-bg: rgba(27,73,101,.34);
  --header-bg: #081a10; --header-fg: #edf3ea; --header-fg-2: #94ae9b; --header-border: rgba(205,231,214,.10); --header-field: rgba(255,255,255,.05);
  --shadow-pop: 0 12px 32px -12px rgba(0,0,0,.5), 0 0 0 1px var(--border);
  --dag-chain: #9ad60c; --dag-chain-stroke: #d6f28a; --dag-blue: #4f7a17; --dag-blue-stroke: #b2e43a;
  --dag-red: #ef8273; --dag-red-fill: rgba(167,36,20,.30); --dag-pending: #94ae9b; --dag-edge: #5f7f69; --dag-spine: #b2e43a;
  --dag-final: rgba(154,214,12,.10); --dag-vote: rgba(255,189,16,.12); --dag-change: #ffcf52; --dag-grid: rgba(205,231,214,.08);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--canvas); color: var(--text-1); font: 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum", "lnum"; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 3px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.small { font-size: 12px; }
.muted { color: var(--text-2); }
.brk { word-break: break-all; }
.r { text-align: right; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
.lnk { color: var(--accent-text); text-decoration: none; border-bottom: 1px solid transparent; }
.lnk:hover { border-bottom-color: currentColor; }
.addr-l { font-size: 12px; color: var(--text-2); }

/* ---------- shell ---------- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--header-bg); color: var(--header-fg); border-bottom: 1px solid var(--header-border); }
.hdr-in { max-width: var(--maxw); margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
.logo-w { font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -.01em; }
.logo-p { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dag-chain); padding: 1px 7px; border: 1px solid rgba(142,204,9,.4); border-radius: var(--r-pill); }
.search { flex: 1 1 260px; position: relative; max-width: 560px; }
.search input { width: 100%; height: 38px; border-radius: var(--r-1); border: 1px solid var(--header-border); background: var(--header-field); color: var(--header-fg); padding: 0 12px; font-size: 14px; }
.search input::placeholder { color: var(--header-fg-2); }
.search-msg { position: absolute; left: 0; top: 42px; font-size: 12px; background: var(--surface-2); color: var(--text-1); border-radius: var(--r-1); box-shadow: var(--shadow-pop); padding: 6px 10px; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav a { color: var(--header-fg-2); text-decoration: none; padding: 7px 10px; border-radius: var(--r-1); font-size: 13.5px; }
.nav a:hover { color: var(--header-fg); background: var(--header-field); }
.nav a[aria-current="page"] { color: var(--header-fg); background: rgba(142,204,9,.14); }
.thm { margin-left: auto; background: transparent; border: 1px solid var(--header-border); color: var(--header-fg-2); border-radius: var(--r-pill); padding: 5px 11px; font-size: 12px; cursor: pointer; }
.sbar { background: var(--warning-bg); color: var(--warning-text); border-bottom: 1px solid var(--border); }
.sbar-in { max-width: var(--maxw); margin: 0 auto; padding: 6px 20px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12.5px; }
.sbar strong { font-family: var(--font-mono); letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warning-text); }
.live-on .live-dot { animation: pulse 1.6s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.sbtn { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: var(--r-pill); font-size: 11.5px; padding: 1px 9px; cursor: pointer; }
main { max-width: var(--maxw); margin: 0 auto; padding-inline: 20px; padding-block: 22px 60px; }
@media (max-width: 560px) { .hdr-in, .sbar-in { padding-inline: 16px; } main { padding-inline: 16px; } .thm { margin-left: 0; } }

/* ---------- page primitives ---------- */
.pg-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 14px; }
.pg-h h1 { font-size: clamp(24px, 4vw, 32px); }
.pg-sub { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); word-break: break-all; }
.lede { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 21px; color: var(--text-2); margin: 0 0 16px; max-width: 60ch; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-3); padding: 16px 18px; min-width: 0; }
.sec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-3); padding: 14px 18px; margin-bottom: 14px; min-width: 0; }
.sec-h { font-size: 15px; margin-bottom: 8px; }
.srow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11.5px; padding: 2px 9px; border-radius: var(--r-pill); background: var(--surface-sunk); color: var(--text-2); border: 1px solid var(--border-2); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px 2px 7px; border-radius: var(--r-pill); white-space: nowrap; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chip-chain { background: var(--accent-tint); color: var(--accent-text); } .chip-chain i { background: var(--dag-chain); box-shadow: 0 0 0 1.5px var(--dag-chain-stroke); }
.chip-blue { background: var(--accent-tint); color: var(--accent-text); } .chip-blue i { background: var(--dag-blue); box-shadow: 0 0 0 1.5px var(--dag-blue-stroke); }
.chip-red { background: var(--danger-bg); color: var(--danger-text); } .chip-red i { background: var(--dag-red-fill); box-shadow: 0 0 0 1.5px var(--dag-red); }
.chip-pending { background: var(--surface-sunk); color: var(--text-2); } .chip-pending i { background: transparent; box-shadow: 0 0 0 1.5px var(--dag-pending); }
.chip-sm { padding: 0 7px 0 5px; font-size: 11px; }
.st-ok { background: var(--accent-tint); color: var(--accent-text); }
.st-bad { background: var(--danger-bg); color: var(--danger-text); }
.st-skip { background: var(--warning-bg); color: var(--warning-text); }
.fin-final { background: var(--accent-tint); color: var(--accent-text); }
.fin-vote { background: var(--warning-bg); color: var(--warning-text); }
.fin-tip { background: var(--info-bg); color: var(--info); }
.meth { font-family: var(--font-mono); font-size: 11.5px; padding: 1px 7px; border-radius: var(--r-1); background: var(--surface-sunk); border: 1px solid var(--border-2); }
.kv { margin: 0; }
.kv-r { display: grid; grid-template-columns: minmax(130px, 210px) 1fr; gap: 4px 16px; padding: 9px 0; border-top: 1px solid var(--border-2); }
.kv-r:first-child { border-top: 0; }
.kv dt { color: var(--text-2); font-size: 13px; }
.kv-h { display: block; font-size: 11.5px; color: var(--text-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv-tight .kv-r { padding: 4px 0; grid-template-columns: 70px 1fr; }
@media (max-width: 560px) { .kv-r { grid-template-columns: 1fr; } }
.copy { background: transparent; border: 1px solid var(--border); border-radius: var(--r-1); font-size: 11px; padding: 1px 7px; color: var(--text-2); cursor: pointer; vertical-align: 1px; }
.copy:hover { border-color: var(--border-strong); color: var(--text-1); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2); padding: 10px 14px; }
.stat-k { font-size: 12px; color: var(--text-2); }
.stat-v { font-family: var(--font-display); font-size: 19px; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; color: var(--text-2); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border-2); white-space: nowrap; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { background: var(--surface-sunk); }
.note { background: var(--info-bg); color: var(--text-1); border-radius: var(--r-2); padding: 10px 12px; margin: 10px 0 0; font-size: 13px; }
.banner { display: block; border-radius: var(--r-2); padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; border: 1px solid var(--border); }
.banner-proxy { background: var(--info-bg); }
.banner-info { background: var(--surface-sunk); }
.banner-ok { background: var(--accent-tint); }
.banner-warn { background: var(--warning-bg); color: var(--text-1); }
.hist { margin-top: 6px; } .hist summary { cursor: pointer; color: var(--text-2); font-size: 12.5px; }
.hist-l { margin: 6px 0 0; padding-left: 18px; }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.flow-s { flex: 1 1 220px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-2); padding: 10px 14px; display: grid; gap: 4px; }
.flow-a { align-self: center; color: var(--text-3); font-family: var(--font-mono); }
.flow-k { font-size: 12px; color: var(--text-2); }
.flow-v { font-family: var(--font-display); font-size: 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.log { border: 1px solid var(--border-2); border-radius: var(--r-2); padding: 10px 12px; margin-bottom: 8px; background: var(--surface-2); }
.log-h { margin-bottom: 4px; font-size: 13px; }
.code-inline { font-family: var(--font-mono); font-size: 12px; margin: 0; white-space: pre-wrap; word-break: break-all; background: var(--surface-sunk); border-radius: var(--r-1); padding: 6px 8px; max-height: 160px; overflow: auto; }
.code-block { font-size: 12.5px; line-height: 1.55; margin: 0; padding: 12px 14px; background: var(--surface-sunk); border-radius: var(--r-2); overflow-x: auto; white-space: pre; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 12px; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
.tabs a { text-decoration: none; padding: 9px 14px; font-size: 13.5px; color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px; }
.tabs a[aria-selected="true"] { color: var(--text-1); border-bottom-color: var(--dag-chain); font-weight: 500; }

/* code pane */
.codegrid { display: grid; grid-template-columns: 200px minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 1000px) { .codegrid { grid-template-columns: minmax(0, 1fr); } }
.ftree { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2); padding: 10px; display: grid; gap: 2px; align-content: start; }
.ftree-h { font-size: 11px; font-family: var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 8px 4px 4px; }
.ftree-h:first-child { margin-top: 0; }
.ftree-i { text-align: left; background: transparent; border: 0; border-radius: var(--r-1); padding: 5px 8px; font-family: var(--font-mono); font-size: 12.5px; cursor: pointer; overflow-wrap: anywhere; }
.ftree-i[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-text); }
.ftree-d { display: block; font-size: 11px; color: var(--text-3); }
.ftree-m { padding: 0 8px; color: var(--text-2); }
.src-pane, .op-pane { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2); min-width: 0; display: flex; flex-direction: column; }
.pane-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; padding: 8px 12px; border-bottom: 1px solid var(--border-2); }
.pane-t { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; }
.src { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; max-height: 520px; overflow: auto; padding: 6px 0; }
.sl { display: grid; grid-template-columns: 40px 1fr; white-space: pre; }
.sl-n { color: var(--text-3); text-align: right; padding-right: 12px; user-select: none; }
.sl-t { padding-right: 12px; }
.sl-op { cursor: pointer; } .sl-op:hover { background: var(--surface-sunk); }
.sl-hl { background: var(--accent-tint); }
.sl-hl0 { box-shadow: inset 3px 0 0 var(--dag-chain); }
.tk-k { color: var(--info); font-weight: 500; } .tk-t { color: var(--accent-text); } .tk-c { color: var(--text-3); font-style: italic; }
.ops { font-family: var(--font-mono); font-size: 12px; max-height: 520px; overflow: auto; padding: 4px 0; display: flex; flex-direction: column; }
.ops-wide { max-height: 620px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2); }
.op { display: grid; grid-template-columns: 44px 84px minmax(0,1fr) auto; gap: 8px; text-align: left; border: 0; background: transparent; padding: 1px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; }
.op-static { cursor: default; }
.op:hover:not(.op-static) { background: var(--surface-sunk); }
.op-pc { color: var(--text-3); } .op-a { color: var(--text-2); overflow-wrap: anywhere; }
.op-gen .op-n { color: var(--text-3); }
.op-on { background: var(--accent-tint) !important; box-shadow: inset 3px 0 0 var(--dag-chain); }
.op-lbl { padding: 8px 12px 2px; color: var(--accent-text); font-weight: 500; border-top: 1px solid var(--border-2); }
.rawhex { padding: 8px 12px; border-top: 1px solid var(--border-2); } .rawhex summary { cursor: pointer; color: var(--text-2); font-size: 12.5px; }

/* forms */
.fnlist { display: grid; gap: 10px; }
.fn { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2); padding: 12px 14px; display: grid; gap: 8px; }
.fn-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-weight: 500; }
.field { display: grid; gap: 4px; }
.field label, .field-row label { font-size: 12.5px; color: var(--text-2); }
.field-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
input, select { height: 36px; border: 1px solid var(--border-strong); background: var(--surface-2); border-radius: var(--r-1); padding: 0 10px; min-width: 0; max-width: 100%; }
input[type="file"] { height: auto; padding: 6px; }
input[aria-invalid="true"] { border-color: var(--danger); }
.err { color: var(--danger-text); font-size: 12px; }
.fn-a { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.res { font-size: 12.5px; overflow-wrap: anywhere; }
.btn { background: var(--dag-chain); color: #0e0f0c; border: 1px solid var(--dag-chain-stroke); border-radius: var(--r-1); padding: 7px 14px; font-weight: 500; cursor: pointer; font-size: 13px; }
.btn:hover { filter: brightness(.95); }
.btn-dis { background: var(--surface-sunk); color: var(--text-2); border-color: var(--border); }
.btn-q { background: transparent; color: var(--text-1); border-color: var(--border-strong); padding: 3px 10px; margin-left: 6px; }
.preview { background: var(--surface-sunk); border-radius: var(--r-2); padding: 10px 12px; display: grid; gap: 6px; }
.vform { display: grid; gap: 12px; }
.cmds { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 12px; }
.cmd { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-2); min-width: 0; }
.cmd-h { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-weight: 500; font-size: 13px; border-bottom: 1px solid var(--border-2); }
.cmd .code-block { border-radius: 0 0 var(--r-2) var(--r-2); }

/* ---------- home ---------- */
.home-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; } .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; } .span-3 { grid-column: span 3; }
@media (max-width: 980px) { .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; } .span-3 { grid-column: span 6; } }
@media (max-width: 520px) { .span-3 { grid-column: span 12; } }
.tile { display: grid; gap: 4px; }
.tile-k { font-size: 12.5px; color: var(--text-2); display: flex; justify-content: space-between; gap: 8px; }
.tile-v { font-family: var(--font-display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tile-v small { font-size: 15px; color: var(--text-2); margin-left: 3px; letter-spacing: 0; }
.tile-s { font-size: 12px; color: var(--text-2); }
.spark { width: 100%; height: 34px; display: block; margin-top: 4px; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-h h2 { font-size: 16px; }
.fband { display: grid; gap: 8px; }
.fband-svg { width: 100%; height: 66px; display: block; }
.fband-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--text-2); }
.fband-legend b { font-family: var(--font-mono); font-weight: 500; color: var(--text-1); }
.share { display: grid; gap: 7px; }
.share-r { display: grid; grid-template-columns: 82px 1fr 48px; gap: 10px; align-items: center; font-size: 12.5px; }
.share-b { height: 10px; background: var(--surface-sunk); border-radius: var(--r-pill); overflow: hidden; }
.share-b i { display: block; height: 100%; background: var(--dag-spine); border-radius: var(--r-pill); }
.share-r .mono { text-align: right; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border-2); font-size: 13px; }
.feed li:first-child { border-top: 0; }
.feed-m { display: grid; gap: 1px; min-width: 0; }
.feed-m > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-r { text-align: right; font-size: 12px; color: var(--text-2); display: grid; gap: 2px; justify-items: end; }
.badge-h { font-family: var(--font-mono); font-size: 12px; background: var(--surface-sunk); border-radius: var(--r-1); padding: 4px 7px; text-decoration: none; }
.new-row { animation: rowin .7s var(--ease); }
@keyframes rowin { from { background: var(--accent-tint); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .new-row, .live-on .live-dot { animation: none; } }

/* ---------- DAG ---------- */
.dag-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 10px; }
.ctrls { display: flex; gap: 6px; flex-wrap: wrap; }
.cbtn { background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--r-pill); padding: 5px 13px; font-size: 12.5px; cursor: pointer; }
.cbtn[aria-pressed="true"] { background: var(--accent-tint); border-color: var(--dag-spine); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); align-items: center; }

.dag-wrap { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-3); overflow-x: auto; overflow-y: hidden; position: relative; }

.dag-svg .lbl-strong { fill: var(--text-2); }
.e-merge { fill: none; stroke: var(--dag-edge); stroke-width: 1.1; opacity: .75; }
.e-sel { fill: none; stroke: var(--dag-edge); stroke-width: 1.8; }
.e-spine { fill: none; stroke: var(--dag-spine); stroke-width: 4; stroke-linecap: round; }
.e-red { stroke: var(--dag-red); stroke-dasharray: 3 3; opacity: .9; }
.n { cursor: pointer; }
.n circle.body { stroke-width: 1.8; transition: opacity .2s; }
.n-chain circle.body { fill: var(--dag-chain); stroke: var(--dag-chain-stroke); }
.n-blue circle.body { fill: var(--dag-blue); stroke: var(--dag-blue-stroke); }
.n-red circle.body { fill: var(--dag-red-fill); stroke: var(--dag-red); stroke-dasharray: 2.5 2; }
.n-red path.x { stroke: var(--dag-red); stroke-width: 1.6; }
.n-pending circle.body { fill: var(--surface-2); stroke: var(--dag-pending); stroke-dasharray: 2 2.5; }
.n .halo { fill: none; stroke: var(--dag-spine); stroke-width: 1.2; opacity: .6; }
.n:focus-visible { outline: none; } .n:focus-visible circle.body { stroke: var(--text-1); stroke-width: 3; }
.n .selring { fill: none; stroke: var(--text-1); stroke-width: 2; }

.has-sel .e-ms { opacity: 1; stroke: var(--text-1); stroke-width: 1.6; }
.n.in-ac circle.body { stroke: var(--dag-change); stroke-width: 2.6; stroke-dasharray: none; }
.chg-line { stroke: var(--dag-change); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chg-lbl { fill: var(--warning-text) !important; font-weight: 500; }
.fin-rect { fill: var(--dag-final); } .vote-rect { fill: var(--dag-vote); }
.grid-l { stroke: var(--dag-grid); stroke-width: 1; }
.dag-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 14px; border-top: 1px solid var(--border-2); font-size: 12px; color: var(--text-2); position: sticky; left: 0; }
.insp { position: sticky; top: 120px; }
.insp h2 { font-size: 18px; margin-bottom: 2px; }
.insp-g { display: grid; gap: 12px; }
.ms-h { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--text-2); margin-bottom: 4px; }
.ms-l { display: flex; flex-wrap: wrap; gap: 4px; }
.ms-i { font-family: var(--font-mono); font-size: 11.5px; border-radius: var(--r-1); padding: 2px 6px; text-decoration: none; border: 1px solid var(--border); background: var(--surface-2); }

    if (kind === "transfer") { t.to = EOAS[Math.floor(R() * 12)]; t.value = String(BigInt(Math.floor(R() * 4000 + 1)) * 10n ** 15n); t.gasUsed = 21000; t.input = "0x"; }
    else if (kind === "register") {
      const name = NAMES[nameIdx++ % NAMES.length] + (nameIdx > NAMES.length ? "-" + nameIdx : "");
      t.to = PROXY; t.value = regFee; t.method = "register(string)"; t.args = [name]; t.input = ABI.encode("f2c298be", ["string"], [name]);

      t.logs.push({ event: "0xf6fdcd5f", topic0: "0xf6fdcd5f89b5d7cd2e70805ed68abdcb82d7b2bd6a4990639ee78ec702372d10", raw: true });

  }
  blocks.forEach((b) => {

  });
  // one duplicate: the same signed tx gossiped into two sibling blocks of one slot

  let dupTx = null;

    const chain = chainFrom(vt);
    const onChain = new Set(chain);
    const color = {};    // i -> "chain" | "blue" | "red" | "pending"
    const acceptedBy = {};
    chain.forEach((c) => {
      color[c] = "chain";
      const cb = blocks[c];
      (cb.blues || []).forEach((x) => { if (!onChain.has(x)) color[x] = "blue"; });
      (cb.reds || []).forEach((x) => { color[x] = "red"; });
      (cb.mergeOrder || []).forEach((x) => { acceptedBy[x] = c; });
    });
    vis.forEach((x) => { if (!color[x]) color[x] = "pending"; });
    const tip = blocks[vt];
    const tipBS = tip.blueScore;
    const finalized = Math.max(0, Math.floor((tipBS - 30) / CHECKPOINT_EVERY) * CHECKPOINT_EVERY);
    const pendingCp = finalized + CHECKPOINT_EVERY;
    const votes = Math.min(66, 40 + ((tipBS - pendingCp + 30) * 3) % 27);
    return { slotN, vis, visSet, tips, vt, chain, onChain, color, acceptedBy, tip, tipBS, finalized, pendingCp, votes, changes: chainChanges.filter((c) => c.slot < slotN) };
  }
  function metrics(v, windowSlots) {
    const lo = v.slotN - windowSlots;
    const sl = slotLog.filter((s) => s.slot >= lo && s.slot < v.slotN);
    const nb = sl.reduce((a, s) => a + s.blocks.length, 0);
    const empty = sl.filter((s) => !s.blocks.length).length;
    const win = v.vis.filter((x) => blocks[x].slot >= lo);
    const chainWin = win.filter((x) => v.onChain.has(x));
    const merging = chainWin.filter((x) => blocks[x].parents.length > 1).length;
    const reds = win.filter((x) => v.color[x] === "red").length;
    const changes = v.changes.filter((c) => c.slot >= lo);
    const share = PRODUCERS.map((p) => ({ p, n: win.filter((x) => blocks[x].producer === p.i).length }));
    const perSlot = sl.map((s) => s.blocks.length);
    return { windowSlots, blocks: nb, perSlot, bps: nb / Math.max(1, sl.length), emptyPct: 100 * empty / Math.max(1, sl.length), mergeRate: 100 * merging / Math.max(1, chainWin.length), redRate: 100 * reds / Math.max(1, win.length), changes: changes.length, maxDepth: changes.reduce((a, c) => Math.max(a, c.depth), 0), share, total: win.length };
  }

  /* ---------- formatting ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- tiny hash router shared by both prototypes ---------- */
function parseRoute() {
  const h = (location.hash || "#home").slice(1);
  const m = h.match(/^(block|tx|addr|contract|dag)-(.+)$/);
  if (m) { const [, kind, rest] = m; const parts = rest.split("-"); return { kind, id: parts[0], tab: parts[1] || null }; }
  return { kind: h || "home" };
}

/* ---------- app controller shared by both prototypes ---------- */
function APP(U) {
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const st = { slotN: CORE.START_VISIBLE, playing: !reduced, wallet: null, tickMs: 2600 };
  const main = document.getElementById("main");
  let timer = null, lastKind = null;
  function now() { return CORE.T0 + st.slotN * CORE.SLOT_MS; }
  function render(fromTick) {
    const r = parseRoute();
    const v = CORE.viewAt(st.slotN);
    U.status(v, st);
    if (fromTick && !(r.kind === "home" || r.kind === "dag")) return;
    const keep = fromTick ? U.saveScroll(main) : null;
    let html;
    const ctx = { st, now: now(), reduced };
    switch (r.kind) {
      case "home": html = U.home(v, ctx); break;
      case "dag": html = U.dag(v, ctx, r.id || null); break;
      case "block": html = SCREENS.block(U, v, r.id); break;
      case "tx": html = SCREENS.tx(U, v, r.id); break;
      case "addr": html = SCREENS.address(U, v, r.id); break;
      case "contract": html = SCREENS.contract(U, v, r.id, r.tab, st); break;
      case "verify": html = SCREENS.verify(U); break;
      default: html = U.page("Not found", `<p class="muted">Nothing at <span class="mono">#${CORE.esc(r.kind)}</span>. <a class="lnk" href="#home">Go home</a>.</p>`);
    }
    main.innerHTML = html;
    U.nav(r.kind);
    SCREENS.wireCopy(main);
    SCREENS.wireCode(main);
    SCREENS.wireForms(main, st, () => render(false));
    SCREENS.wireVerify(main);
    U.after(main, v, ctx, r);
    if (keep) U.restoreScroll(main, keep);

    toggle() { st.playing = !st.playing; if (st.slotN >= CORE.NSLOTS && st.playing) st.slotN = CORE.START_VISIBLE; start(); render(true); },
    step() { st.playing = false; stop(); if (st.slotN < CORE.NSLOTS) st.slotN++; render(true); },

/* ---------- DAG layout on a blue-score axis (shared geometry, drawn differently per direction) ---------- */
function dagLayout(v, maxBlocks) {
  const C = CORE;
  const vis = v.vis.slice().sort((a, b) => C.blocks[a].blueScore - C.blocks[b].blueScore || a - b).slice(-maxBlocks);
  const set = new Set(vis);
  const minBS = C.blocks[vis[0]].blueScore, maxBS = C.blocks[vis[vis.length - 1]].blueScore;
  const cols = {};
  const nodes = {};
  const order = [0, 1, -1, 2, -2, 3, -3];
  vis.forEach((i) => {
    const b = C.blocks[i]; const c = b.blueScore - minBS;
    const used = cols[c] || (cols[c] = new Set());
    let lane;
    if (v.onChain.has(i)) lane = 0; else lane = order.find((l) => l !== 0 && !used.has(l)) ?? 4;
    used.add(lane);
    nodes[i] = { i, b, col: c, lane, color: v.color[i], tip: v.tips.includes(i) };
  });
  const edges = [];
  vis.forEach((i) => { C.blocks[i].parents.forEach((p) => { if (set.has(p)) edges.push({ from: p, to: i, sel: C.blocks[i].sp === p, chain: v.onChain.has(i) && v.onChain.has(p) && C.blocks[i].sp === p }); }); });
  const lanes = Object.values(nodes).map((n) => n.lane);
  return { vis, set, nodes, edges, minBS, maxBS, minLane: Math.min(...lanes, -1), maxLane: Math.max(...lanes, 1) };
}
/* selection context for the mergeset inspector */
function dagSelection(v, i) {
  const C = CORE; const b = C.blocks[i];
  const ac = C.anticone(i, v);
  return { i, b, blues: b.blues || [], reds: b.reds || [], anticone: ac, past: b.past, mergeset: new Set([...(b.blues || []), ...(b.reds || [])]) };
}

      <div class="dag-top">${legend()}<div class="ctrls"><button class="cbtn" type="button" data-stream="${st.slotN >= C.NSLOTS ? "replay" : "toggle"}" aria-pressed="${st.playing}">${st.slotN >= C.NSLOTS ? "Replay" : st.playing ? "Pause stream" : "Play stream"}</button><button class="cbtn" type="button" data-stream="step">Step one slot</button>${redExample(v) !== undefined ? `<a class="cbtn" style="text-decoration:none" href="#dag-${C.blocks[redExample(v)].hash}">Show a merge with red blocks</a>` : ""}</div></div>
      <div class="dag-layout"><div style="min-width:0">
        <div class="dag-wrap" id="dagwrap">${dagSvg(v, 80, selB, false)}<div class="dag-foot"><span>Green band: finalized by checkpoint votes</span><span>Yellow band: checkpoint voting</span><span>Scroll sideways for older blocks</span></div></div>
        <section class="sec" style="margin-top:14px"><h2 class="sec-h">Selected-chain changes</h2>${changes.length ? `<ul class="tl">${changes.map((c) => `<li><span class="mono small">slot ${C.num(c.slot + 72000)}</span><span>Depth ${c.depth}: ${c.removed.map(hb).join(", ")} left the selected chain and ${c.added.map(hb).join(", ")} joined it. The losing block stays in the DAG and is merged as a side block.</span></li>`).join("")}</ul>` : `<p class="muted">No changes in the sample window.</p>`}</section>
      </div>${inspector(v, selB)}</div>`;
  };
  U.after = (main, v, ctx, r) => {
    main.querySelectorAll(".dag-svg .n").forEach((g) => {
      const go = () => { location.hash = "dag-" + g.dataset.h; };
      g.addEventListener("click", go); g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } });
    });
    main.querySelectorAll(".dag-wrap").forEach((w) => {
      const sel = w.querySelector(".n.is-sel circle.body");
      if (sel) { const cx = +sel.getAttribute("cx"); w.scrollLeft = Math.max(0, cx - w.clientWidth * 0.6); } else w.scrollLeft = w.scrollWidth;
    });
  };
  return U;
})();

/* search: block hash, tx hash, address, or height */
function wireSearch(formId) {
  const f = document.getElementById(formId); if (!f) return;
  const msg = f.querySelector(".search-msg");
  f.addEventListener("submit", (ev) => {
    ev.preventDefault(); const q = f.querySelector("input").value.trim().toLowerCase(); msg.hidden = true;
    const C = CORE;
    if (/^\d+$/.test(q)) { const b = C.blocks.find((x) => C.H(x) === +q); if (b) { location.hash = "block-" + b.hash; return; } }
    if (C.byHash[q]) { location.hash = "block-" + q; return; }
    if (C.txByHash[q]) { location.hash = "tx-" + q; return; }
    if ([C.PROXY, C.IMPL, C.IMPL_OLD, C.GUEST].includes(q)) { location.hash = "contract-" + q; return; }
    if (/^0x[0-9a-f]{40}$/.test(q)) { location.hash = "addr-" + q; return; }
    const pre = C.blocks.find((x) => q.length > 5 && x.hash.startsWith(q)); if (pre) { location.hash = "block-" + pre.hash; return; }
    msg.textContent = "No match in the sample data. Try a height such as " + C.num(C.H(C.blocks[150])).replace(/,/g, "") + "."; msg.hidden = false;
  });
}

document.getElementById("shell").innerHTML = document.getElementById("shell").innerHTML.replaceAll("__PROXY__", CORE.PROXY).replaceAll("__GUEST__", CORE.GUEST);
wireSearch("srch");
window.PROTO = APP(UA);
</script>
