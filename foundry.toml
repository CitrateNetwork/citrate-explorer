[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["contracts/lib"]
test = "contracts/test"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=contracts/lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./contracts/out" }]

[rpc_endpoints]
citrate = "https://rpc.citrate.ai"
