\* TLC config for SelectedParentReconcile (Sprint S-1, WP-1.3).
\* Small, bounded CONSTANTS so TLC terminates quickly.
\* FinalityDepth = 2 abstracts the real value of 100.

SPECIFICATION Spec

CONSTANTS
    Genesis = g
    Hashes = {h1, h2, h3}
    FinalityDepth = 2

INVARIANTS
    TypeOK
    FinalityImmutable
    SingleLiveChain

PROPERTIES
    NoDeletion
    FinalNeverRewritten
