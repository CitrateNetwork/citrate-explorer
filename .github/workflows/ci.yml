name: CI

# Build + typecheck + lint + unit tests on every PR and push to main (P-9 WP-9.1).
# Complements the four ratchet workflows: this is the "does it compile and pass"
# gate. Live-RPC tests stay gated behind LIVE_RPC (unset here) so CI is hermetic.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # EX-B-005 (RM-Q, 2026-09-06): fail the build on any HIGH-severity
      # dependency advisory. The pin previously carried 28 open HIGHs (4 next
      # CVEs on this public app + runtime-reachable tmp/sharp). This gate blocks
      # a regression; moderate/low are reported but non-blocking. Keep in
      # lockstep with the `pnpm.overrides` in package.json.
      - name: Dependency audit (block HIGH)
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # The app builds with no secrets (graceful-null DB, env-driven inference),
      # so a clean prod build is a real signal, not a config artifact.
      - name: Build
        run: pnpm build
