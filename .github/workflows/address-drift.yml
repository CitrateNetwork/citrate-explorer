name: address-drift

# Blocking CL-C2 gate: fails CI if this repo's vendored 40204 address book drifts
# from the canonical citrate-chain source of truth. After a re-roll, this goes red
# until the repo re-syncs — the control that was missing when the 2026-07-27 reroll
# silently shipped dead addresses across the federation.
#
# citrate-chain is a public repository, so the job checks it out without a token and
# always runs. It used to skip itself green when the CITRATE_CHAIN_READ_TOKEN secret was
# absent, and that secret was never set, so the gate never checked anything (2026-11-11,
# fed ops/r1007-ceremony/ADDRESS_PROPAGATION.md gap 2). The daily schedule turns it red
# when the chain's book moves (a new genesis), even with no change in this repo.

on:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/generated/addresses.json'
      - 'src/generated/chainConstants.json'
      - 'scripts/sync-addresses.mjs'
      - 'scripts/lib/chainSync.mjs'
      - 'scripts/lib/chainLabels.mjs'
      - '.github/workflows/address-drift.yml'

permissions:
  contents: read

concurrency:
  group: address-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: consumer
          persist-credentials: false
      - name: Checkout canonical citrate-chain (sparse)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CitrateNetwork/citrate-chain
          ref: main
          persist-credentials: false
          path: citrate-chain
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            contracts/addresses/
            packages/chain-config/
            core/execution/src/precompiles/mod.rs
            core/economics/src/genesis.rs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Address drift check (blocking)
        run: |
          node citrate-chain/packages/chain-config/bin/check.mjs \
            check "consumer/src/generated/addresses.json" \
            --canonical citrate-chain/contracts/addresses/40204.json
      - name: Generated chain constants drift check (blocking)
        # Precompile catalog + genesis allocations, regenerated from the same chain checkout.
        run: node consumer/scripts/sync-addresses.mjs --chain citrate-chain --only constants --check
