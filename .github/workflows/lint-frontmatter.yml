name: Lint Frontmatter

# Rule 12 enforcer — fires on every PR. Runs `check_frontmatter.py`
# scoped to the .md files the PR actually changed under .agentile/.
#
# Why scoped: a fresh project's first few sprints will accumulate a
# lot of valid pre-rule artifacts that don't have frontmatter; the
# ratchet (ratchet 4) gates the project-wide fraction. This workflow
# enforces that NEW docs added in a PR all have frontmatter, which is
# the strict subset that should never regress.

on:
  pull_request:
    paths:
      - '.agentile/**/*.md'
      - 'scripts/ci/check_frontmatter.py'
      - '.github/workflows/lint-frontmatter.yml'
  push:
    branches: [main]
    paths:
      - '.agentile/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-frontmatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Frontmatter required (Rule 12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine changed .md files under .agentile/
        id: changed
        env:
          # EX-B-006: refs via env, never interpolated into the script body.
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BASE"; head="$PUSH_HEAD"
          fi
          # EX-B-006: emit a NUL-delimited FILE, not a shell value. Attacker-
          # controlled PR filenames must never reach a `run:` interpolation — the
          # old `--files ${{ steps.changed.outputs.files }}` executed a filename
          # like `pwned$(...).md` on the runner. The consumer reads --files0.
          list="${RUNNER_TEMP:-/tmp}/changed_frontmatter_files"
          git diff --name-only -z --diff-filter=AM "$base" "$head" -- '.agentile/**/*.md' \
            | { grep -zv '^\.agentile/INDEX/' || true; } > "$list"
          if [[ -s "$list" ]]; then has_files=1; else has_files=0; fi
          echo "has_files=$has_files" >> "$GITHUB_OUTPUT"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Check frontmatter on changed files
        if: ${{ steps.changed.outputs.has_files == '1' }}
        env:
          LIST: ${{ steps.changed.outputs.list }}
        run: |
          ./scripts/ci/check_frontmatter.py --files0 "$LIST"

      - name: No relevant changes
        if: ${{ steps.changed.outputs.has_files == '0' }}
        run: |
          echo "No .md changes under .agentile/ in this PR; nothing to check."
